# ==============================================================================
# ML Rain Predictor - Industrial Configuration Pipeline
# Author: Ahmad Fathin Naufal (Universitas Gadjah Mada)
# Specification: Meteorological Ingestion, Scikit-learn, XGBoost, Power BI
# ==============================================================================

project:
  name: "ml-rain-predictor"
  version: "1.0.0"
  author: "Ahmad Fathin Naufal"
  institution: "Universitas Gadjah Mada (UGM)"
  description: "Automated rainfall classification pipeline using BMKG meteorological data"

paths:
  raw_data: "data/raw/bmkg_weather_raw.csv"
  processed_train: "data/processed/train_features.csv"
  processed_test: "data/processed/test_features.csv"
  model_dir: "outputs/models"
  figure_dir: "outputs/figures"
  powerbi_dir: "powerbi"
  powerbi_dataset: "powerbi/powerbi_rainfall_dataset.csv"

meteorology:
  stations:
    - id: 96745
      name: "Stasiun Meteorologi Kemayoran"
      city: "Jakarta Pusat"
      lat: -6.158
      lon: 106.842
      elevation_m: 4.0
    - id: 96749
      name: "Stasiun Meteorologi Maritim Tanjung Priok"
      city: "Jakarta Utara"
      lat: -6.112
      lon: 106.884
      elevation_m: 2.0
    - id: 96741
      name: "Stasiun Meteorologi Soekarno-Hatta"
      city: "Tangerang/Cengkareng"
      lat: -6.126
      lon: 106.654
      elevation_m: 10.0
    - id: 96739
      name: "Stasiun Geofisika Curug"
      city: "Tangerang"
      lat: -6.284
      lon: 106.564
      elevation_m: 46.0
    - id: 96753
      name: "Stasiun Klimatologi Dermaga Bogor"
      city: "Bogor"
      lat: -6.558
      lon: 106.756
      elevation_m: 242.0

  rain_threshold_mm: 0.5  # WMO/BMKG standard: >= 0.5 mm is classified as measurable rain

  magnus_tetens:
    a: 17.27
    b: 237.7  # in degrees Celsius

features:
  numeric:
    - "temp_c"
    - "humidity_pct"
    - "pressure_hpa"
    - "wind_speed_ms"
    - "wind_deg"
    - "solar_radiation_pct"
    - "dew_point_c"
    - "dew_spread_c"
    - "pressure_tendency_3h"
    - "hour_sin"
    - "hour_cos"
    - "month_sin"
    - "month_cos"
  target: "rainfall_binary"

split:
  test_size: 0.20
  random_state: 42
  stratify: true

models:
  decision_tree:
    criterion: "gini"
    max_depth: 8
    min_samples_split: 10
    min_samples_leaf: 4
    random_state: 42

  random_forest:
    n_estimators: 150
    criterion: "gini"
    max_depth: 12
    min_samples_split: 6
    min_samples_leaf: 2
    class_weight: "balanced"
    random_state: 42
    n_jobs: -1

  xgboost:
    n_estimators: 180
    max_depth: 6
    learning_rate: 0.08
    subsample: 0.85
    colsample_bytree: 0.85
    eval_metric: "logloss"
    random_state: 42
    n_jobs: -1
